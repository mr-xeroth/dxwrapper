# ddraw wrapper configuration file
# note: whichever scale option appears first among window_size, scale_int, scale_float
# takes priority and the remaining two are ignored.

# option 1: explicit target window size
window_size = 1280x960

# option 2: integer scale multiplier (e.g. 2x, 3x)
# scale_int = 2

# option 3: floating point scale multiplier (e.g. 1.5)
# scale_float = 1.5

# aspect ratio preservation:
# true: keeps aspect ratio with black bars (letterbox/pillarbox)
# false: stretches display to fill window
aspect_ratio = true

# allow window resizing by dragging borders and corners
resizable = true

# vertical sync (vsync)
vsync = true

# post-processing glsl shader from dosbox svn
# examples:
#   crt\crt-geom.glsl
#   crt\crt-lottes.glsl
#   crt\fakelottes.glsl
shader = crt\crt-easymode.glsl

# texture filtering mode:
# openglnb = nearest-neighbor filtering (required for most crt/scanline shaders)
# opengl   = bilinear filtering
filter = openglnb

# mouse capture mode:
# seamless = mouse pointer moves freely into and out of wrapper window to interact with desktop
# onclick  = clicking in wrapper window locks mouse to game; release key or button unlocks mouse and restores OS cursor
mouse_capture = seamless

# mouse release key or button (active when mouse_capture = onclick):
# supports modifier combinations (ctrl, alt, shift), keys (f1-f12, a-z, 0-9, space, esc, tab, enter, etc.),
# and mouse buttons (lmb, rmb, mmb).
# examples:
#   alt+f12
#   ctrl+alt+shift+m
#   ctrl+rmb
# default setting is f12
mouse_release = f12
